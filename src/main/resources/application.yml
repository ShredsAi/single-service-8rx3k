server:
  port: 8080

spring:
  application:
    name: message-persister
  datasource:
    url: jdbc:mysql://localhost:3306/messagesDB
    username: root
    password: password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: messageDB
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    ai.shreds: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.data.jpa: INFO
